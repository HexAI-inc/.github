name: Research spike
description: A time-boxed investigation of something we do not know yet
title: "Research: "
labels: ["research"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: The one question this spike answers.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why we need to know
      description: The decision or task that is waiting on the answer.
    validations:
      required: true
  - type: input
    id: timebox
    attributes:
      label: Time box
      description: The most time to spend before reporting back, for example "3 days".
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Approach
      description: What will be read, built or measured.
  - type: textarea
    id: findings
    attributes:
      label: Findings
      description: Filled in when the spike ends. Include links, numbers and what was not covered.
  - type: textarea
    id: done
    attributes:
      label: Definition of done
      value: |
        - [ ] Findings written in this issue
        - [ ] The decision or task that was waiting is updated
    validations:
      required: true
