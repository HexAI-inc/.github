name: Bug report
description: Something is broken or behaves differently from what was intended
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, including any error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to
        2. Click
        3. See the error
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Where it happens
      options:
        - Local
        - Staging
        - Production
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      description: How bad is it for the people using the product?
      options:
        - Data is lost or wrong
        - A feature is unusable
        - A feature works with a workaround
        - Cosmetic
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version, device and browser
      description: Release or commit, plus device and browser if it is a client bug.
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Remove passwords, keys and personal data before pasting.
