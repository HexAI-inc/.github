name: Feature
description: New functionality that a user of the product will notice
title: "Feature: "
labels: ["feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who needs this, and what can they not do today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: What the user can do when this is finished.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is included and what is deliberately left out.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checks that anyone can run to confirm it works.
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: Related issues, designs and decisions
